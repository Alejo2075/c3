version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws:
        patterns: ['aws-cdk*', '@aws-sdk/*', 'constructs']
  - package-ecosystem: npm
    directory: /runtime-assets/entrypoint
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /runtime-assets
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
