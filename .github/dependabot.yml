version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws:
        patterns: ['aws-cdk*', '@aws-sdk/*', 'constructs']
    ignore:
      # Types track the minimum supported Node.js major (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /runtime-assets/entrypoint
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /runtime-assets
    schedule:
      interval: weekly
    ignore:
      # The runtime image stays on Node.js 22 LTS until a deliberate upgrade.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
